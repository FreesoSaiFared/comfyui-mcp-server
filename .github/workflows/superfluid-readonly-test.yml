name: SUPERFLUID isolated read-only MCP source boundary
on:
  push:
    branches: [integration/superfluid-readonly-admission]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fresh isolated Python environment and exact-source test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m venv /tmp/superfluid-mcp-venv
          source /tmp/superfluid-mcp-venv/bin/activate
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip freeze > evidence/PIP_FREEZE.txt
          python -m py_compile server.py superfluid_readonly.py superfluid_safe_comfy.py superfluid_host_isolation.py superfluid_host_observer.py tests/test_superfluid_readonly.py tests/test_superfluid_safe_comfy.py tests/test_superfluid_host_isolation.py tests/test_superfluid_host_observer.py tests/test_superfluid_kernel_observer.py tests/test_superfluid_capability_fence.py tests/test_superfluid_import_fence.py tests/test_superfluid_discovery_bounds.py tests/test_superfluid_discovery_deadline.py tests/superfluid_stdio_probe.py
          python -m unittest discover -s tests -p 'test_superfluid_*.py' -v 2>&1 | tee evidence/TESTS.log
          python tests/superfluid_protocol_probe.py 2>&1 | tee evidence/ACTUAL_MCP_HTTP_PROTOCOL.log
          python tests/superfluid_stdio_probe.py 2>&1 | tee evidence/ACTUAL_MCP_STDIO_PROTOCOL.log
          mkdir -p evidence/source
          cp server.py superfluid_readonly.py superfluid_safe_comfy.py superfluid_host_isolation.py superfluid_host_observer.py requirements.txt tests/test_superfluid_readonly.py tests/test_superfluid_safe_comfy.py tests/test_superfluid_host_isolation.py tests/test_superfluid_host_observer.py tests/test_superfluid_kernel_observer.py tests/test_superfluid_capability_fence.py tests/test_superfluid_import_fence.py tests/test_superfluid_discovery_bounds.py tests/test_superfluid_discovery_deadline.py tests/superfluid_protocol_probe.py tests/superfluid_stdio_probe.py evidence/source/
          git diff --binary e0101b2312f30501664dabe4a74c1283c4268eb8..HEAD > evidence/OWNER_FORK_BASE_TO_REVIEW_BRANCH.patch
          git rev-parse HEAD > evidence/SOURCE_COMMIT.txt
          git status --porcelain=v1 > evidence/WORKTREE_STATUS.txt
          git hash-object server.py superfluid_readonly.py superfluid_safe_comfy.py superfluid_host_isolation.py superfluid_host_observer.py tests/test_superfluid_readonly.py tests/test_superfluid_safe_comfy.py tests/test_superfluid_host_isolation.py tests/test_superfluid_host_observer.py tests/test_superfluid_kernel_observer.py tests/test_superfluid_capability_fence.py tests/test_superfluid_import_fence.py tests/test_superfluid_discovery_bounds.py tests/test_superfluid_discovery_deadline.py tests/superfluid_stdio_probe.py > evidence/SOURCE_BLOB_SHA.txt
          sha256sum server.py superfluid_readonly.py superfluid_safe_comfy.py superfluid_host_isolation.py superfluid_host_observer.py tests/test_superfluid_readonly.py tests/test_superfluid_safe_comfy.py tests/test_superfluid_host_isolation.py tests/test_superfluid_host_observer.py tests/test_superfluid_kernel_observer.py tests/test_superfluid_capability_fence.py tests/test_superfluid_import_fence.py tests/test_superfluid_discovery_bounds.py tests/test_superfluid_discovery_deadline.py tests/superfluid_stdio_probe.py docs/HOST_ISOLATION_CONTRACT.md docs/HOST_OBSERVER_HANDOFF.md docs/HOST_SHARED_PORT_AUDIT.md docs/M088_REAL_KERNEL_OBSERVER_PROBE.md docs/M089_STDIO_PROTOCOL_INTEGRITY.md docs/M090_READONLY_CAPABILITY_MINIMIZATION.md docs/M091_READONLY_IMPORT_FENCE.md docs/M092_BOUNDED_DISCOVERY.md docs/M093_SLOW_BODY_DEADLINE.md > evidence/SOURCE_SHA256SUMS.txt
      - name: Preserve test provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superfluid-readonly-real-fork-tests
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
